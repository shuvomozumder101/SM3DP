<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Shobo Mozumder | 3D Solar System Portfolio</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        screens: {
          'xs': '475px',
          'sm': '640px',
          'md': '768px',
          'lg': '1024px',
          'xl': '1280px',
          '2xl': '1536px',
        },
        extend: {
          colors: {
            space: {
              dark: '#02040a',
              card: 'rgba(11, 15, 25, 0.85)',
              border: 'rgba(56, 189, 248, 0.2)'
            }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['Fira Code', 'monospace']
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
<style>
/* =========================================================
   GLOBAL
   ========================================================= */

* {
  box-sizing: border-box;
  scrollbar-width: thin;
  scrollbar-color: #0284c7 #02040a;
}

html {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-size: clamp(14px, 0.35vw + 13px, 18px);
  background: #02040a;
}

body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  min-width: 280px;
  overflow: hidden;
  background-color: #02040a;
  color: #f3f4f6;
  font-family: 'Outfit', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

button {
  font-family: inherit;
}


/* =========================================================
   THREE.JS / WEBGL
   ========================================================= */

#webgl-container {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  z-index: 0;
  overflow: hidden;
}

#webgl-container canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}


/* =========================================================
   PLANET LABEL OVERLAY
   ========================================================= */

#planet-labels-overlay {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  z-index: 5;
  pointer-events: none;
  overflow: hidden;
}

.planet-badge {
  position: absolute;
  top: 0;
  left: 0;

  padding: 6px 14px;

  border-radius: 9999px;
  border: 1px solid rgba(56, 189, 248, 0.55);

  font-size: 11px;
  font-weight: 700;
  font-family: 'Fira Code', monospace;

  white-space: nowrap;

  background: rgba(2, 12, 38, 0.75);

  backdrop-filter: blur(1px);
  -webkit-backdrop-filter: blur(1px);

  box-shadow: 0 0 20px rgba(1, 32, 37, 0.3);

  transform: translate(-50%, -240%);

  pointer-events: auto;
  cursor: pointer;

  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease,
    box-shadow 0.2s ease,
    transform 0.2s ease;

  will-change: transform, opacity;
}

.planet-badge:hover {
  background: rgba(6, 182, 212, 0.45);
  border-color: #ffffff;
  color: #ffffff;

  box-shadow:
    0 0 30px rgba(56, 189, 248, 0.9);

  transform: translate(-50%, -260%) scale(1.08);
}

.planet-badge.active-target {
  background: rgba(168, 85, 247, 0.75) !important;
  border-color: #a855f7 !important;
  color: #ffffff !important;

  box-shadow:
    0 0 35px rgba(168, 85, 247, 0.95) !important;
}


/* =========================================================
   GLASS PANEL
   ========================================================= */

.glass-panel {
  background: rgb(2 12 38 / 94%);

  backdrop-filter: blur(1px);
  -webkit-backdrop-filter: blur(1px);

  border: 2px solid rgba(185, 211, 223, 0.25);

  box-shadow:
    0 20px 50px -10px rgba(0, 0, 0, 0.9);
}


/* =========================================================
   GLASS CARD
   ========================================================= */

.glass-card {
  --mx: 50%;
  --my: 50%;
  --light-color: rgba(56, 189, 248, 1);

  position: relative;
  isolation: isolate;

  overflow: hidden;

  backdrop-filter: blur(1px);
  -webkit-backdrop-filter: blur(1px);

  border: 2px solid rgba(146, 163, 170, 0.2);

  transition:
    transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
    border-color 0.3s ease,
    box-shadow 0.3s ease;
}

.glass-card::before {
  content: "";

  position: absolute;
  inset: -2px;

  padding: 2px;

  border-radius: inherit;

  background:
    radial-gradient(
      90px 90px at var(--mx) var(--my),
      var(--light-color) 0%,
      rgba(56, 189, 248, 0.55) 12%,
      rgba(56, 189, 248, 0.18) 30%,
      transparent 65%
    );

  /*
    Keep only the border portion visible.
  */
  -webkit-mask:    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

  -webkit-mask-composite: xor;
  mask-composite: exclude;

  opacity: 0;

  pointer-events: none;

  transition: opacity 0.2s ease;
}

.glass-card::after {
  content: "";

  position: absolute;

  width: 180px;
  height: 180px;

  left: var(--mx);
  top: var(--my);

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(56, 189, 248, 0.10),
      transparent 70%
    );

  pointer-events: none;

  opacity: 0;

  transition: opacity 0.2s ease;
}

.glass-card:hover {
  border-color: rgba(55, 146, 185, 0.55);

  transform: translateY(-2px);

  box-shadow:
    0 12px 30px -5px rgba(6, 182, 212, 0.3),
    0 0 35px rgba(56, 189, 248, 0.08);
}

.glass-card:hover::before,
.glass-card:hover::after {
  opacity: 1;
}


/* =========================================================
   INFO DRAWER
   ========================================================= */

#info-drawer {
  max-width: 100vw;

  overflow-x: hidden;
  overflow-y: auto;

  -webkit-overflow-scrolling: touch;

  scrollbar-width: thin;
  scrollbar-color: #0284c7 rgba(15, 23, 42, 0.5);
}

#info-drawer::-webkit-scrollbar {
  width: 6px;
}

#info-drawer::-webkit-scrollbar-track {
  background: rgba(15, 23, 42, 0.5);
}

#info-drawer::-webkit-scrollbar-thumb {
  background: #0284c7;
  border-radius: 3px;
}

#drawer-content {
  width: 100%;
  max-width: 100%;
  overflow-wrap: anywhere;
}


/* =========================================================
   PROJECT MODAL
   ========================================================= */

#project-modal {
  -webkit-overflow-scrolling: touch;
}

#project-modal > div {
  width: min(100%, 800px);
  max-width: 800px;
  max-height: 85vh;
  max-height: 85dvh;

  overflow-x: hidden;
  overflow-y: auto;

  -webkit-overflow-scrolling: touch;
}

#modal-content {
  width: 100%;
  max-width: 100%;
  overflow-wrap: anywhere;
}


/* =========================================================
   TERMINAL
   ========================================================= */

.terminal-box {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;

  background: rgba(2, 4, 10, 0.96);

  font-family: 'Fira Code', monospace;

  border: 1px solid rgba(56, 189, 248, 0.3);
}


/* =========================================================
   EARTH — GLASS SHAKE
   ========================================================= */

.glass-shake {
  transition:
    transform 0.18s ease,
    background 0.25s ease,
    border-color 0.25s ease,
    box-shadow 0.25s ease;

  transform: translate3d(0, 0, 0);

  will-change: transform;
}

.glass-shake:hover {
  animation: glassShake 0.45s ease-in-out;

  background: rgba(255, 255, 255, 0.055);

  border-color: rgba(255, 255, 255, 0.22);

  box-shadow:
    0 10px 30px rgba(0, 0, 0, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

@keyframes glassShake {

  0% {
    transform: translate3d(0, 0, 0) rotate(0deg);
  }

  20% {
    transform: translate3d(-2px, 1px, 0) rotate(-0.4deg);
  }

  40% {
    transform: translate3d(2px, -1px, 0) rotate(0.4deg);
  }

  60% {
    transform: translate3d(-1px, 1px, 0) rotate(-0.25deg);
  }

  80% {
    transform: translate3d(1px, 0, 0) rotate(0.2deg);
  }

  100% {
    transform: translate3d(0, 0, 0) rotate(0deg);
  }
}


/* =========================================================
   EARTH SKILLS
   ========================================================= */

.earth-skill-track {
  height: 6px;
  width: 100%;

  overflow: hidden;

  border-radius: 999px;

  background: rgba(30, 41, 59, 0.9);
}

.earth-skill-fill {
  height: 100%;
  width: 0;

  border-radius: 999px;

  transition:
    width 1.4s cubic-bezier(0.1, 0.9, 0.2, 1);

  box-shadow:
    0 0 10px rgba(56, 189, 248, 0.25);
}


/* =========================================================
   EARTH TOOL CARD
   ========================================================= */

.earth-tool-card {
  transition:
    transform 0.2s ease,
    background 0.25s ease,
    border-color 0.25s ease,
    box-shadow 0.25s ease;
}

.earth-tool-card:hover {
  background: rgba(255, 255, 255, 0.055);

  border-color: rgba(56, 189, 248, 0.28);

  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}


/* =========================================================
   PHONE
   280px → 639px
   ========================================================= */

@media (max-width: 639px) {

  html,
  body {
    width: 100%;
    height: 100%;
    height: 100dvh;
  }

  /* Header */

  header {
    padding-top: env(safe-area-inset-top);
  }

  header > div {
    padding-left: 10px !important;
    padding-right: 10px !important;
    padding-top: 7px !important;
  }

  header .glass-panel {
    min-height: 52px;

    padding: 7px 9px;

    border-width: 1px;
    border-radius: 14px;
  }

  header .glass-panel > a {
    min-width: 0;
    gap: 7px;
  }

  header .glass-panel > a span {
    max-width: 140px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    font-size: 12px;
  }

  header .glass-panel > a > div {
    width: 32px !important;
    height: 32px !important;

    flex-shrink: 0;
  }

  /* Orbit button */

  #reset-orbit-btn {
    min-width: 40px;
    min-height: 40px;

    padding: 8px 10px;

    justify-content: center;
  }

  /* Mobile menu */

  #mobile-menu {
    padding-left: 10px !important;
    padding-right: 10px !important;
  }

  #mobile-menu .glass-panel {
    padding: 8px;

    border-radius: 16px;

    max-height: calc(100dvh - 78px);

    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  #mobile-menu button {
    min-height: 54px;

    padding: 7px 5px;

    line-height: 1.25;
    font-size: 9px;

    border-radius: 11px;
  }

  /* Planet labels */

  .planet-badge {
    padding: 4px 9px;

    font-size: 9px;

    border-width: 1px;

    transform: translate(-50%, -190%);
  }

  .planet-badge:hover {
    transform: translate(-50%, -200%) scale(1.04);
  }

  /* Drawer */

  #info-drawer {
    width: 100vw !important;
    max-width: 100vw;

    height: 100dvh;

    padding-top:
      max(58px, calc(env(safe-area-inset-top) + 50px));

    padding-left: 16px;
    padding-right: 16px;

    padding-bottom:
      max(24px, calc(env(safe-area-inset-bottom) + 20px));

    border-radius: 0;
    border-left: 0;
    border-right: 0;
  }

  #close-drawer-btn {
    top: max(12px, env(safe-area-inset-top));
    right: 12px;

    width: 42px;
    height: 42px;

    z-index: 20;
  }

  /* Modal */

  #project-modal {
    padding: 10px;

    align-items: flex-end;
  }

  #project-modal > div {
    width: 100%;
    max-width: 100%;

    max-height: 90dvh;

    padding: 18px;

    padding-top: 50px;

    border-radius: 22px;
  }

  /* Cards */

  .glass-card {
    border-width: 1px;
  }

  /* Touch */

  button,
  .planet-badge {
    touch-action: manipulation;
  }
}


/* =========================================================
   SMALL PHONES
   <= 380px
   ========================================================= */

@media (max-width: 380px) {

  header > div {
    padding-left: 7px !important;
    padding-right: 7px !important;
  }

  header .glass-panel {
    padding: 6px 7px;
    border-radius: 12px;
  }

  header .glass-panel > a span {
    font-size: 10px;
    max-width: 105px;
  }

  header .glass-panel > a > div {
    width: 29px !important;
    height: 29px !important;
  }

  #reset-orbit-btn {
    min-width: 38px;
    min-height: 38px;
    padding: 6px 8px;
  }

  #mobile-menu .glass-panel {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  #mobile-menu button {
    min-height: 48px;
    font-size: 8.5px;
  }

  .planet-badge {
    font-size: 8px;
    padding: 3px 7px;
  }

  #info-drawer {
    padding-left: 12px;
    padding-right: 12px;
  }

  #project-modal {
    padding: 6px;
  }

  #project-modal > div {
    padding: 15px;
    padding-top: 48px;
    border-radius: 18px;
  }
}


/* =========================================================
   TABLET
   640px → 1023px
   ========================================================= */

@media (min-width: 640px) and (max-width: 1023px) {

  header > div {
    padding-left: 18px !important;
    padding-right: 18px !important;
  }

  header .glass-panel {
    padding: 10px 14px;
    border-radius: 18px;
  }

  /* Tablet mobile menu */

  #mobile-menu {
    padding-left: 18px !important;
    padding-right: 18px !important;
  }

  #mobile-menu .glass-panel {
    padding: 12px;

    grid-template-columns:
      repeat(3, minmax(0, 1fr));

    gap: 8px;

    max-height: calc(100dvh - 90px);

    overflow-y: auto;
  }

  #mobile-menu button {
    min-height: 58px;

    padding: 9px 6px;

    font-size: 10px;
    line-height: 1.3;
  }

  /* Drawer */

  #info-drawer {
    width: min(620px, 85vw) !important;

    height: 100dvh;

    padding: 32px;
  }

  /* Modal */

  #project-modal {
    padding: 24px;
  }

  #project-modal > div {
    width: min(700px, 90vw);
    max-height: 88dvh;
  }

  /* Labels */

  .planet-badge {
    font-size: 10px;
    padding: 5px 11px;
  }
}


/* =========================================================
   LAPTOP
   1024px → 1279px
   ========================================================= */

@media (min-width: 1024px) and (max-width: 1279px) {

  header > div {
    padding-left: 20px !important;
    padding-right: 20px !important;
  }

  header .glass-panel {
    padding: 10px 15px;
  }

  header nav {
    max-width: 68vw;

    overflow-x: auto;

    scrollbar-width: none;

    white-space: nowrap;
  }

  header nav::-webkit-scrollbar {
    display: none;
  }

  header nav button {
    flex-shrink: 0;

    padding-left: 7px;
    padding-right: 7px;

    font-size: 9px;
  }

  #info-drawer {
    width: min(600px, 60vw) !important;

    padding: 30px;
  }

  #project-modal > div {
    max-width: 700px;
  }
}


/* =========================================================
   DESKTOP
   1280px → 1535px
   ========================================================= */

@media (min-width: 1280px) and (max-width: 1535px) {

  header > div {
    padding-left: 28px !important;
    padding-right: 28px !important;
  }

  header nav button {
    font-size: 10px;
  }

  #info-drawer {
    width: min(650px, 48vw) !important;
  }
}


/* =========================================================
   LARGE DESKTOP
   1536px+
   ========================================================= */

@media (min-width: 1536px) {

  header > div {
    max-width: 1800px;

    padding-left: 32px !important;
    padding-right: 32px !important;
  }

  header .glass-panel {
    padding: 12px 22px;
    min-height: 64px;
  }

  header nav {
    gap: 2px;
  }

  header nav button {
    padding: 8px 11px;
    font-size: 11px;
  }

  #info-drawer {
    width: min(700px, 42vw) !important;

    padding: 40px;
  }

  #project-modal > div {
    max-width: 800px;
  }
}


/* =========================================================
   2K / 4K / ULTRA WIDE
   2000px+
   ========================================================= */

@media (min-width: 2000px) {

  html {
    font-size: 18px;
  }

  header > div {
    max-width: 1900px;
  }

  header .glass-panel {
    min-height: 68px;
  }

  header nav button {
    font-size: 12px;
  }

  #info-drawer {
    width: 720px !important;
  }
}


/* =========================================================
   LANDSCAPE PHONE
   ========================================================= */

@media (max-width: 896px) and (orientation: landscape) {

  header > div {
    padding-top: 4px !important;
  }

  header .glass-panel {
    min-height: 46px;
    padding-top: 4px;
    padding-bottom: 4px;
  }

  #mobile-menu .glass-panel {
    max-height: calc(100dvh - 62px);
  }

  #mobile-menu button {
    min-height: 42px;
  }

  #info-drawer {
    padding-top: 55px;
  }

  #project-modal > div {
    max-height: 92dvh;
  }
}


/* =========================================================
   SHORT SCREENS
   ========================================================= */

@media (max-height: 650px) {

  header > div {
    padding-top: 4px !important;
  }

  header .glass-panel {
    min-height: 46px;
  }

  #mobile-menu .glass-panel {
    max-height: calc(100dvh - 62px);
  }

  #info-drawer {
    padding-top: 58px;
  }
}


/* =========================================================
   TOUCH DEVICES
   ========================================================= */

@media (hover: none) and (pointer: coarse) {

  .glass-card:hover,
  .earth-tool-card:hover,
  .glass-shake:hover,
  .planet-badge:hover {
    transform: none;
  }

  .glass-card:active,
  .earth-tool-card:active {
    transform: scale(0.99);
  }

  #close-drawer-btn,
  #mobile-menu-btn,
  #reset-orbit-btn {
    min-width: 42px;
    min-height: 42px;
  }
}


/* =========================================================
   SAFE AREA — NOTCH / DYNAMIC ISLAND
   ========================================================= */

@supports (padding: env(safe-area-inset-top)) {

  header > div {
    padding-top: max(
      7px,
      env(safe-area-inset-top)
    ) !important;
  }

  #info-drawer {
    padding-bottom: max(
      24px,
      calc(env(safe-area-inset-bottom) + 20px)
    );
  }

  #project-modal {
    padding-bottom: max(
      10px,
      env(safe-area-inset-bottom)
    );
  }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
  }

  .glass-card,
  .glass-shake,
  .earth-tool-card,
  .planet-badge,
  #info-drawer,
  #project-modal {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }

  .glass-shake:hover {
    animation: none !important;
  }

  .earth-skill-fill {
    transition: none !important;
  }
}


/* =========================================================
   PRINT
   ========================================================= */

@media print {

  body {
    overflow: visible;
    background: white;
    color: black;
  }

  #webgl-container,
  #planet-labels-overlay,
  header,
  #info-drawer,
  #project-modal {
    display: none !important;
  }
}
</style>

</head>

  <header class="fixed top-0 left-0 w-full z-30 transition-all duration-300 pointer-events-none">
    <div class="max-w-8xl mx-auto px-3 sm:px-6 lg:px-8 py-3">
      <div class="glass-panel rounded-2xl px-4 sm:px-6 py-2.5 sm:py-3 flex items-center justify-between pointer-events-auto">

            SM
          </div>
          <span class="text-base sm:text-lg font-black tracking-tight text-white group-hover:text-amber-400 transition-colors">
            SM<span class="text-cyan-400">.Portfolio</span>
          </span>
        </a>
        
        <nav class="hidden lg:flex items-center space-x-1 font-mono text-xs font-semibold text-slate-200">

           <!-- Earth -->

   ========================================================= */

function handleTerminalCommand(event) {

  event.preventDefault();

  const input =
    document.getElementById('terminal-input');

  const output =
    document.getElementById('terminal-output');

  if (!input || !output) return;

  const cmd =
    input.value.trim().toLowerCase();

  if (!cmd) return;

  const newLine =
    document.createElement('div');

  newLine.innerHTML =
    `<span class="text-amber-400 font-bold">$ ${cmd}</span>`;

  output.appendChild(newLine);

  let responseText = '';

  if (cmd === 'help') {

    responseText =
      'Commands: ' +
      '<b>about</b>, ' +
      '<b>skills</b>, ' +
      '<b>info</b>, ' +
      '<b>experience</b>, ' +
      '<b>projects</b>, ' +
      '<b>education</b>, ' +
      '<b>contact</b>, ' +
      '<b>clear</b>';

  }

  else if (cmd === 'about') {

    selectCelestialBody('mercury');

    responseText =
      'Warping to Mercury (About)...';

  }

  else if (cmd === 'skills') {

    selectCelestialBody('venus');

    responseText =
      'Warping to Venus (Academic & Reference)...';

  }

  else if (cmd === 'info') {

    selectCelestialBody('earth');

    responseText =
      'Warping to Earth (Tech Stack Matrix)...';

  }

  else if (cmd === 'experience') {

    selectCelestialBody('moon');

    responseText =
      'Warping to Moon (Employment)...';

  }

  else if (cmd === 'projects') {

    selectCelestialBody('mars');

    responseText =
      'Warping to Mars (Projects)...';

  }

  else if (cmd === 'education') {

    selectCelestialBody('jupiter');

    responseText =
      'Warping to Jupiter (Applications)...';

  }

  else if (cmd === 'contact') {

    selectCelestialBody('saturn');

    responseText =
      'Warping to Saturn (Contact)...';

  }

  else if (cmd === 'clear') {

    output.innerHTML = '';
    input.value = '';

    return;

  }

  else {

    responseText =
      `Command '${cmd}' not recognized. ` +
      `Try 'about', 'skills', 'experience', ` +
      `'projects', 'education', or 'contact'.`;

  }

  const resLine =
    document.createElement('div');

  resLine.className =
    'text-slate-200 pl-2 border-l border-amber-500/50 font-medium';

  resLine.innerHTML =
    responseText;

  output.appendChild(resLine);

  output.scrollTop =
    output.scrollHeight;

  input.value = '';
}

/* =========================================================
   INITIALIZE
   ========================================================= */

function initSolarSystem() {

  const container =
    document.getElementById(
      'webgl-container'
    );

  const labelsOverlay =
    document.getElementById(
      'planet-labels-overlay'
    );

  if (!container) return;

  celestialBodies = [];
  interactableMeshes = [];

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(0x02040a);

  scene.fog =
    new THREE.FogExp2(
      0x02040a,
      isMobile
        ? 0.0025
        : 0.0018
    );


  /* =======================================================
     CAMERA
     ======================================================= */

  camera =
    new THREE.PerspectiveCamera(
      isMobile ? 60 : 55,
      window.innerWidth /
        window.innerHeight,
      0.1,
      1000
    );

  camera.position.copy(
    initialCameraPos
  );


  /* =======================================================
     RENDERER
     ======================================================= */

  renderer =
    new THREE.WebGLRenderer({

      antialias:
        !isMobile,

      alpha: true,

      powerPreference:
        'high-performance'

    });


  renderer.setSize(
    window.innerWidth,
    window.innerHeight,
    false
  );


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio || 1,
      MAX_PIXEL_RATIO
    )
  );


  if (
    'outputColorSpace'
    in renderer
  ) {

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

  }


  renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

  renderer.toneMappingExposure =
    isMobile ? 1.05 : 1.15;


  container.innerHTML = '';

  container.appendChild(
    renderer.domElement
  );


  /* =======================================================
     ORBIT CONTROLS
     ======================================================= */

  controls =
    new THREE.OrbitControls(
      camera,
      renderer.domElement
    );

  controls.enableDamping = true;

  controls.dampingFactor =
    isMobile ? 0.08 : 0.05;

  controls.minDistance = 5;

  controls.maxDistance =
    isMobile ? 150 : 180;

  /*
   * Important:
   * Pan causes mobile interaction conflicts.
   */
  controls.enablePan = false;

  controls.enableZoom = true;

  controls.rotateSpeed =
    isMobile ? 0.55 : 0.8;

  controls.zoomSpeed =
    isMobile ? 0.6 : 1;


  /* =======================================================
     LIGHTING
     ======================================================= */

  const ambientLight =
    new THREE.AmbientLight(
      0xffffff,
      isMobile ? 0.12 : 0.08
    );

  scene.add(
    ambientLight
  );


  const sunLight =
    new THREE.PointLight(
      0xffffff,
      isMobile ? 8 : 10,
      500,
      1.5
    );

  sunLight.position.set(
    0,
    0,
    0
  );

  scene.add(
    sunLight
  );


  const warmLight =
    new THREE.PointLight(
      0xffc27a,
      isMobile ? 0.45 : 0.8,
      250,
      2
    );

  warmLight.position.set(
    -60,
    30,
    40
  );

  scene.add(
    warmLight
  );


  /* =======================================================
     STARFIELD
     ======================================================= */

  createStarField();


  /* =======================================================
     TEXTURE LOADER
     ======================================================= */

  const textureLoader =
    new THREE.TextureLoader();

  textureLoader.crossOrigin =
    'anonymous';


  /* =======================================================
     PLANETS
     ======================================================= */

  celestialSpecs.forEach(
    spec => {

      createCelestialBody(
        spec,
        textureLoader,
        labelsOverlay
      );

    }
  );


  /* =======================================================
     RESIZE
     ======================================================= */

  window.addEventListener(
    'resize',
    onWindowResize,
    { passive: true }
  );


  /*
   * Orientation change can produce a wrong camera
   * aspect ratio on some phones.
   */

  window.addEventListener(
    'orientationchange',
    () => {

      setTimeout(
        onWindowResize,
        150
      );

    },
    { passive: true }
  );


  /* =======================================================
     RAYCASTING
     ======================================================= */

  setupRaycasting();


  /* =======================================================
     DRAWER SWIPE
     ======================================================= */

  setupDrawerSwipe();


  /* =======================================================
     BUTTONS
     ======================================================= */

  setupButtons();


  /*
   * DO NOT CALL animate() HERE.
   *
   * It is called only once from window.onload.
   */
}


/* =========================================================
   STAR FIELD
   ========================================================= */

function createStarField() {

  const starGeo =
    new THREE.BufferGeometry();

  const starPositions =
    new Float32Array(
      STAR_COUNT * 3
    );


  for (
    let i = 0;
    i < STAR_COUNT * 3;
    i++
  ) {

    starPositions[i] =
      (Math.random() - 0.5) * 600;

  }


  starGeo.setAttribute(
    'position',
    new THREE.BufferAttribute(
      starPositions,
      3
    )
  );


  const starMat =
    new THREE.PointsMaterial({

      color: 0xffffff,

      size:
        isMobile
          ? 0.45
          : 0.65,

      transparent: true,

      opacity: 0.9,

      sizeAttenuation: true

    });


  const starField =
    new THREE.Points(
      starGeo,
      starMat
    );

  scene.add(
    starField
  );
}


/* =========================================================
   CREATE CELESTIAL BODY
   ========================================================= */

function createCelestialBody(
  spec,
  textureLoader,
  labelsOverlay
) {

  /* =======================================================
     ORBIT
     ======================================================= */

  if (spec.dist > 0) {

    const orbitGeo =
      new THREE.RingGeometry(
        spec.dist - 0.035,
        spec.dist + 0.035,
        isMobile ? 64 : 96
      );


    const orbitMat =
      new THREE.MeshBasicMaterial({

        color: 0x38bdf8,

        transparent: true,

        opacity:
          isMobile ? 0.08 : 0.12,

        side:
          THREE.DoubleSide

      });


    const orbit =
      new THREE.Mesh(
        orbitGeo,
        orbitMat
      );


    orbit.rotation.x =
      Math.PI / 2;


    scene.add(
      orbit
    );
  }


  /* =======================================================
     PIVOT
     ======================================================= */

  const pivot =
    new THREE.Group();

  scene.add(
    pivot
  );


  /* =======================================================
     PLANET GEOMETRY
     ======================================================= */

  const geo =
    new THREE.SphereGeometry(
      spec.r,
      PLANET_SEGMENTS,
      PLANET_SEGMENTS
    );


  /* =======================================================
     MATERIAL
     ======================================================= */

  let mat;


  if (spec.type === 'sun') {

    mat =
      new THREE.MeshStandardMaterial({

        color: 0xffaa00,

        roughness: 0.25,

        metalness: 0,

        emissive: 0xff6500,

        emissiveIntensity: 1.5

      });

  }

  else {

    /*
     * Explicit base color prevents white fallback
     * when texture is still loading.
     */

    mat =
      new THREE.MeshStandardMaterial({

        color:
          spec.ambientColor ||
          0xaaaaaa,

        roughness:
          spec.roughness ?? 0.85,

        metalness:
          spec.metalness ?? 0,

        emissive:
          spec.emissive ?? 0x000000,

        emissiveIntensity:
          spec.emissiveIntensity ?? 0

      });

  }


  /* =======================================================
     TEXTURE
     ======================================================= */

  if (spec.map) {

    textureLoader.load(

      spec.map,

      texture => {

        texture.colorSpace =
          THREE.SRGBColorSpace;

        texture.anisotropy =
          Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            isMobile ? 2 : 4
          );

        mat.map =
          texture;

        /*
         * Once texture exists,
         * use white so actual texture shows correctly.
         */

        mat.color.set(
          0xffffff
        );

        mat.needsUpdate =
          true;

      },

      undefined,

      error => {

        console.warn(
          `Texture failed: ${spec.id}`,
          error
        );

      }

    );

  }


  /* =======================================================
     BUMP
     ======================================================= */

  if (spec.bump) {

    textureLoader.load(

      spec.bump,

      texture => {

        texture.colorSpace =
          THREE.NoColorSpace;

        mat.bumpMap =
          texture;

        mat.bumpScale =
          spec.id === 'mars'
            ? 0.12
            : 0.05;

        mat.needsUpdate =
          true;

      }

    );

  }


  /* =======================================================
     SPECULAR
     ======================================================= */

  if (spec.spec) {

    textureLoader.load(

      spec.spec,

      texture => {

        texture.colorSpace =
          THREE.NoColorSpace;

        /*
         * Keep your existing behavior.
         */

        mat.roughnessMap =
          texture;

        mat.needsUpdate =
          true;

      }

    );

  }


  /* =======================================================
     MESH
     ======================================================= */

  const mesh =
    new THREE.Mesh(
      geo,
      mat
    );


  mesh.position.x =
    spec.dist;


  mesh.userData = {

    id: spec.id,

    name: spec.name

  };


  pivot.add(
    mesh
  );


  /* =======================================================
     ATMOSPHERE
     ======================================================= */

  if (spec.atmosphere) {

    const atmosphereGeo =
      new THREE.SphereGeometry(
        spec.r * 1.025,
        isMobile ? 32 : 48,
        isMobile ? 32 : 48
      );


    const atmosphereMat =
      new THREE.MeshBasicMaterial({

        color:
          spec.atmosphereColor ||
          0x3b82f6,

        transparent: true,

        opacity:
          spec.atmosphereOpacity ||
          0.035,

        side:
          THREE.BackSide,

        blending:
          THREE.AdditiveBlending,

        depthWrite: false

      });


    const atmosphere =
      new THREE.Mesh(
        atmosphereGeo,
        atmosphereMat
      );


    mesh.add(
      atmosphere
    );


    mesh.userData.atmosphere =
      atmosphere;

  }


  /* =======================================================
     JUPITER RIM
     ======================================================= */

  if (spec.id === 'jupiter') {

    const rimGeo =
      new THREE.SphereGeometry(
        spec.r * 1.045,
        isMobile ? 32 : 48,
        isMobile ? 32 : 48
      );


    const rimMat =
      new THREE.MeshBasicMaterial({

        color: 0xd69b6b,

        transparent: true,

        opacity: 0.12,

        side:
          THREE.BackSide,

        blending:
          THREE.AdditiveBlending,

        depthWrite: false

      });


    const rim =
      new THREE.Mesh(
        rimGeo,
        rimMat
      );


    mesh.add(
      rim
    );


    mesh.userData.jupiterRim =
      rim;

  }


  /* =======================================================
     SATURN RINGS
     ======================================================= */

  if (
    spec.id === 'saturn' &&
    spec.rings
  ) {

    createSaturnRings(
      spec,
      mesh
    );

  }


  /* =======================================================
     EARTH CLOUDS
     ======================================================= */

  if (spec.id === 'earth') {

    createEarthClouds(
      spec,
      mesh,
      textureLoader
    );

  }


  /* =======================================================
     SUN GLOW
     ======================================================= */

  if (spec.type === 'sun') {

    const glowGeo =
      new THREE.SphereGeometry(
        spec.r * 1.18,
        isMobile ? 24 : 40,
        isMobile ? 24 : 40
      );


    const glowMat =
      new THREE.MeshBasicMaterial({

        color:
          spec.glowColor ||
          0xffaa22,

        transparent: true,

        opacity:
          isMobile ? 0.12 : 0.18,

        blending:
          THREE.AdditiveBlending,

        depthWrite: false

      });


    const glow =
      new THREE.Mesh(
        glowGeo,
        glowMat
      );


    mesh.add(
      glow
    );


    mesh.userData.sunGlow =
      glow;

  }


  /* =======================================================
     LABEL
     ======================================================= */

  const badgeEl =
    document.createElement(
      'div'
    );


  badgeEl.className =
    'planet-badge';


  badgeEl.dataset.id =
    spec.id;


  badgeEl.innerHTML = `
    ${spec.name}
    <span class="text-[10px] opacity-75">
      (${spec.role})
    </span>
  `;


  badgeEl.addEventListener(
    'click',
    event => {

      event.stopPropagation();

      selectCelestialBody(
        spec.id
      );

    }
  );


  labelsOverlay.appendChild(
    badgeEl
  );


  /* =======================================================
     STORE
     ======================================================= */

  const body = {

    id: spec.id,

    pivot,

    mesh,

    speed:
      spec.speed ?? 0,

    rotationSpeed:
      spec.rotationSpeed ?? 0.01,

    el: badgeEl,

    radius: spec.r

  };


  celestialBodies.push(
    body
  );


  interactableMeshes.push(
    mesh
  );


  /* =======================================================
     MOON
     ======================================================= */

  if (spec.id === 'earth') {

    createMoon(
      mesh,
      textureLoader,
      labelsOverlay
    );

  }
}


/* =========================================================
   SATURN RINGS
   ========================================================= */

function createSaturnRings(
  spec,
  mesh
) {

  const ringGroup =
    new THREE.Group();


  const ringBands = [

    [1.15, 1.27, 0.82],

    [1.30, 1.46, 0.52],

    [1.49, 1.68, 0.78],

    [1.71, 1.87, 0.42],

    [1.90, 2.08, 0.70],

    [2.11, 2.40, 0.55]

  ];


  ringBands.forEach(
    ([inner, outer, opacity]) => {

      const ringGeo =
        new THREE.RingGeometry(
          spec.r * inner,
          spec.r * outer,
          spec.ringSegments
        );


      const ringMat =
        new THREE.MeshStandardMaterial({

          color:
            spec.ringColor ||
            0xe8d6aa,

          roughness:
            spec.ringRoughness ||
            0.92,

          metalness: 0,

          transparent: true,

          opacity,

          side:
            THREE.DoubleSide,

          depthWrite: false

        });


      const ring =
        new THREE.Mesh(
          ringGeo,
          ringMat
        );


      ring.rotation.x =
        Math.PI / 2;


      ringGroup.add(
        ring
      );

    }
  );


  ringGroup.rotation.z =
    spec.ringTilt ||
    THREE.MathUtils.degToRad(26.7);


  mesh.add(
    ringGroup
  );


  mesh.userData.ringGroup =
    ringGroup;
}


/* =========================================================
   EARTH CLOUDS
   ========================================================= */

function createEarthClouds(

) {

    new THREE.SphereGeometry(

    );


  const cloudMat =
    new THREE.MeshStandardMaterial({

      color: 0xffffff,

      transparent: true,

      opacity: 0.38,

      depthWrite: false,

      side:
        THREE.DoubleSide

    });


  textureLoader.load(

    'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_clouds_1024.png',

    texture => {

      texture.colorSpace =
        THREE.SRGBColorSpace;

      cloudMat.map =
        texture;

      cloudMat.needsUpdate =
        true;

    }

  );


  const clouds =
    new THREE.Mesh(

      cloudMat
    );


  mesh.add(
    clouds
  );


  mesh.userData.cloudMesh =
    clouds;
}

/* =========================================================
   RAYCASTING
   ========================================================= */

function setupRaycasting() {

  const raycaster =
    new THREE.Raycaster();


  const mouse =
    new THREE.Vector2();


  let pointerDown = null;


  renderer.domElement.addEventListener(
    'pointerdown',
    event => {

      pointerDown = {

        x: event.clientX,

        y: event.clientY

      };

    },
    { passive: true }
  );


  renderer.domElement.addEventListener(
    'pointerup',
    event => {

      if (!pointerDown) return;


      const dx =
        event.clientX -
        pointerDown.x;


      const dy =
        event.clientY -
        pointerDown.y;


      const movement =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      /*
       * If the user moved the finger,
       * this was probably an orbit gesture.
       */

      if (movement > 12) {

        pointerDown = null;

        return;

      }


      const rect =
        renderer.domElement.getBoundingClientRect();


      mouse.x =
        ((event.clientX - rect.left) /
          rect.width) *
          2 -
        1;


      mouse.y =
        -(
          (event.clientY - rect.top) /
            rect.height
        ) *
          2 +
        1;


      raycaster.setFromCamera(
        mouse,
        camera
      );


      const intersects =
        raycaster.intersectObjects(
          interactableMeshes,
          false
        );


      if (intersects.length) {

        const clicked =
          intersects[0].object;


        if (
          clicked.userData &&
          clicked.userData.id
        ) {

          selectCelestialBody(
            clicked.userData.id
          );

        }

      }


      pointerDown = null;

    },
    { passive: true }
  );
}


/* =========================================================
   DRAWER SWIPE
   ========================================================= */

function setupDrawerSwipe() {

  const drawer =
    document.getElementById(
      'info-drawer'
    );


  if (!drawer) return;


  let touchStartX = 0;


  drawer.addEventListener(
    'touchstart',
    event => {

      touchStartX =
        event.changedTouches[0].screenX;

    },
    { passive: true }
  );


  drawer.addEventListener(
    'touchend',
    event => {

      const touchEndX =
        event.changedTouches[0].screenX;


      if (
        touchEndX -
        touchStartX >
        80
      ) {

        resetToOrbitView();

      }

    },
    { passive: true }
  );
}


/* =========================================================
   BUTTONS
   ========================================================= */

function setupButtons() {

  const resetButton =
    document.getElementById(
      'reset-orbit-btn'
    );


  if (resetButton) {

    resetButton.addEventListener(
      'click',
      resetToOrbitView
    );

  }


  const closeButton =
    document.getElementById(
      'close-drawer-btn'
    );


  if (closeButton) {

    closeButton.addEventListener(
      'click',
      resetToOrbitView
    );

  }
}


/* =========================================================
   SELECT PLANET
   ========================================================= */

function selectCelestialBody(id) {

  const bodyObj =
    celestialBodies.find(
      body => body.id === id
    );


  if (!bodyObj) return;


  const previousBody =
    selectedBody;


  selectedBody =
    bodyObj;


  /*
   * Background
   */

  focusOnCelestialObject(
    id
  );


  /*
   * Highlight labels
   */

  celestialBodies.forEach(
    body => {

      if (body.el) {

        body.el.classList.toggle(
          'active-target',
          body === bodyObj
        );

      }

    }
  );


  /*
   * Portfolio data
   */

  const data =
    typeof portfolioPages !== 'undefined'
      ? portfolioPages[id]
      : null;


  if (!data) {

    console.warn(
      `No portfolio page found for: ${id}`
    );

    return;

  }


  const content =
    document.getElementById(
      'modal-content'
    );


  if (!content) return;


  content.innerHTML = `

    <div class="text-center mb-5">

      <div
        class="
          text-[9px]
          sm:text-[10px]
          uppercase
          tracking-[0.3em]
          sm:tracking-[0.35em]
          text-cyan-300/70
          font-mono
          mb-2
        "
      >
        ${bodyObj.id.toUpperCase()}
      </div>

      <h3
        class="
          text-xl
          sm:text-2xl
          md:text-3xl
          font-bold
          text-white
          leading-tight
        "
      >
        ${data.title || bodyObj.name}
      </h3>

      <div
        class="
          w-16
          h-px
          bg-cyan-400/40
          mx-auto
          mt-3
        "
      ></div>

    </div>

    ${data.render()}

  `;


  /*
   * Open modal
   */

  const modal =
    document.getElementById(
      'project-modal'
    );


  if (modal) {

    modal.classList.remove(
      'hidden'
    );

    modal.classList.add(
      'flex'
    );

  }


  document.body.classList.add(
    'overflow-hidden'
  );


  /*
   * Camera transition
   */

  if (
    previousBody &&
    previousBody !== selectedBody
  ) {

    launchRocketBetweenPlanets(
      previousBody,
      bodyObj
    );

  }

  else {

    isTransitioning =
      true;

  }


  /*
   * Close mobile menu automatically
   */

  const mobileMenu =
    document.getElementById(
      'mobile-menu'
    );


  if (
    mobileMenu &&
    !mobileMenu.classList.contains(
      'hidden'
    )
  ) {

    mobileMenu.classList.add(
      'hidden'
    );

  }
}


/* =========================================================
   ROCKET JOURNEY
   ========================================================= */

function launchRocketBetweenPlanets(
  fromBody,
  toBody
) {

  const startVec =
    new THREE.Vector3();


  const endVec =
    new THREE.Vector3();


  fromBody.mesh.getWorldPosition(
    startVec
  );


  toBody.mesh.getWorldPosition(
    endVec
  );


  rocketJourney.active =
    true;


  rocketJourney.startPos.copy(
    startVec
  );


  rocketJourney.endPos.copy(
    endVec
  );


  rocketJourney.progress =
    0;


  isTransitioning =
    true;
}


/* =========================================================
   BADGE UPDATE
   ========================================================= */

const badgeWorldPosition =
  new THREE.Vector3();


function updatePlanetBadges() {

  const halfW =
    window.innerWidth / 2;


  const halfH =
    window.innerHeight / 2;


  celestialBodies.forEach(
    body => {

      if (!body.el) return;


      body.mesh.getWorldPosition(
        badgeWorldPosition
      );


      badgeWorldPosition.project(
        camera
      );


      const x =
        badgeWorldPosition.x *
          halfW +
        halfW;


      const y =
        -badgeWorldPosition.y *
          halfH +
        halfH;


      const visible =
        badgeWorldPosition.z < 1 &&
        x >= -100 &&
        x <= window.innerWidth + 100 &&
        y >= -100 &&
        y <= window.innerHeight + 100;


      if (visible) {

        body.el.style.display =
          'block';


        body.el.style.opacity =
          '1';


        body.el.style.transform =
          `translate3d(
            ${x.toFixed(1)}px,
            ${y.toFixed(1)}px,
            0
          ) translate(-50%, -120%)`;

      }

      else {

        body.el.style.display =
          'none';

      }

    }
  );
}


/* =========================================================
   CAMERA TRANSITION
   ========================================================= */

function updateCameraTransition() {

  if (
    !selectedBody ||
    !isTransitioning
  ) {

    return;

  }


  const targetPos =
    selectedBody.mesh.getWorldPosition(
      cameraTargetWorld
    );


  const distance =
    isMobile
      ? selectedBody.radius * 4.5
      : selectedBody.radius * 3.5;


  targetCamPos.set(
    targetPos.x,
    targetPos.y +
      selectedBody.radius *
        1.8,
    targetPos.z +
      distance
  );


  targetLookAt.copy(
    targetPos
  );


  /*
   * Faster transition.
   */

  camera.position.lerp(
    targetCamPos,
    isMobile ? 0.09 : 0.07
  );


  controls.target.lerp(
    targetLookAt,
    isMobile ? 0.11 : 0.08
  );


  if (
    camera.position.distanceTo(
      targetCamPos
    ) < 0.25
  ) {

    isTransitioning =
      false;

  }
}


const cameraTargetWorld =
  new THREE.Vector3();


/* =========================================================
   RESET ORBIT
   ========================================================= */

function resetToOrbitView() {

  selectedBody =
    null;


  isTransitioning =
    false;


  targetCamPos.copy(
    initialCameraPos
  );


  targetLookAt.set(
    0,
    0,
    0
  );


  celestialBodies.forEach(
    body => {

      if (body.el) {

        body.el.classList.remove(
          'active-target'
        );

      }

    }
  );


  const modal =
    document.getElementById(
      'project-modal'
    );


  if (modal) {

    modal.classList.add(
      'hidden'
    );

    modal.classList.remove(
      'flex'
    );

  }


  document.body.classList.remove(
    'overflow-hidden'
  );


  /*
   * Smoothly return to original position.
   */

  isTransitioning =
    true;

  selectedBody =
    null;


  /*
   * Manually animate reset.
   */

  resetCameraAnimation =
    true;
}


let resetCameraAnimation =
  false;


/* =========================================================
   RESET CAMERA
   ========================================================= */

function updateResetCamera() {

  if (!resetCameraAnimation) {
    return;
  }


  camera.position.lerp(
    initialCameraPos,
    isMobile ? 0.08 : 0.06
  );


  controls.target.lerp(
    targetLookAt.set(
      0,
      0,
      0
    ),
    isMobile ? 0.1 : 0.08
  );


  if (
    camera.position.distanceTo(
      initialCameraPos
    ) < 0.2
  ) {

    camera.position.copy(
      initialCameraPos
    );

    controls.target.set(
      0,
      0,
      0
    );

    resetCameraAnimation =
      false;

  }
}


/* =========================================================
   EARTH SKILLS
   IMPORTANT:
   DO NOT RUN THIS EVERY FRAME.
   ========================================================= */

let earthSkillsAnimated =
  false;


function animateEarthSkills() {

  if (earthSkillsAnimated) {
    return;
  }


  const bars =
    document.querySelectorAll(
      '.earth-skill-fill'
    );


  if (!bars.length) {
    return;
  }


  earthSkillsAnimated =
    true;


  bars.forEach(
    (bar, index) => {

      const target =
        bar.dataset.targetWidth;


      setTimeout(
        () => {

          bar.style.width =
            target;

        },
        100 + index * 100
      );

    }
  );
}


/* =========================================================
   RESIZE
   ========================================================= */

function onWindowResize() {

  if (!camera || !renderer) {
    return;
  }


  const width =
    window.innerWidth;


  const height =
    window.innerHeight;


  camera.aspect =
    width / height;


  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height,
    false
  );


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio || 1,
      MAX_PIXEL_RATIO
    )
  );
}


/* =========================================================
   ANIMATION LOOP
   ========================================================= */

let animationRunning =
  false;


function animate() {

  if (animationRunning) {
    return;
  }


  animationRunning =
    true;


  requestAnimationFrame(
    animate
  );


  /*
   * Planet rotation.
   */

  celestialBodies.forEach(
    body => {

      if (body.speed > 0) {

        body.pivot.rotation.y +=
          body.speed;

      }


      body.mesh.rotation.y +=
        body.rotationSpeed *
        0.08;


      /*
       * Earth clouds.
       */

      if (
        body.mesh.userData
          .cloudMesh
      ) {

        body.mesh.userData
          .cloudMesh
          .rotation.y +=
            0.001;

      }

    }
  );


  /*
   * Camera.
   */

  updateCameraTransition();

  updateResetCamera();


  /*
   * Controls.
   */

  controls.update();


  /*
   * Labels.
   */

  updatePlanetBadges();


  /*
   * Skills only when needed.
   */

  animateEarthSkills();


  /*
   * Render.
   */

  renderer.render(
    scene,
    camera
  );


  animationRunning =
    false;
}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

window.addEventListener(
  'load',
  () => {

    initSolarSystem();

    /*
     * IMPORTANT:
     * animate() is called ONLY ONCE.
     */

    animate();

  },
  { once: true }
);


document.querySelectorAll(".glass-card").forEach((card) => {

  card.addEventListener("pointermove", (event) => {

    const rect = card.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    card.style.setProperty("--mx", `${x}px`);
    card.style.setProperty("--my", `${y}px`);

  });

  card.addEventListener("pointerleave", () => {

    card.style.setProperty("--mx", "50%");
    card.style.setProperty("--my", "50%");

  });

});



/* =========================================================
   EMAIL JS
   ========================================================= */

if (
  typeof emailjs !== 'undefined'
) {

  emailjs.init({
    publicKey:
      'IDEfYEaKsLnqo_5Q3'
  });


  const form =
    document.getElementById(
      'contactForm'
    );


  if (form) {

    form.addEventListener(
      'submit',
      function (event) {

        event.preventDefault();


        const submitButton =
          document.getElementById(
            'submit-btn'
          );


        if (submitButton) {

          submitButton.disabled =
            true;

          submitButton.innerHTML =
            `
              <i class="
                fa-solid
                fa-circle-notch
                animate-spin
                mr-2
              "></i>
              Transmitting...
            `;

        }


        emailjs
          .sendForm(
            'service_opikbhu',
            'template_b4zio0b',
            this
          )

          .then(
            () => {
              alert('Message Sent!');
              form.reset();
              if (submitButton) {
                submitButton.disabled =false;
                submitButton.innerHTML ='Send Message';
              }
            }
          )

          .catch(
            error => {

              console.error(
                error
              );
              alert(
                error.text ||
                JSON.stringify(error)
              );
              if (submitButton) {

                submitButton.disabled =
                  false;

                submitButton.innerHTML =
                  'Send Message';

              }
            }
          );
      
        }
        );  
      }
}
  </script>
